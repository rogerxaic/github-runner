name: build-and-push-ghcr

# Build the self-hosted runner image and publish it to GHCR.
# The only publish target is ghcr.io/rogerxaic/github-runner.

on:
  push:
    branches:
      - master
    paths-ignore:
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rogerxaic/github-runner

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ghcr
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:ubuntu-26.04
            ${{ env.IMAGE }}:latest
